name: Build and attach release executables

# Two ways in:
#  1. Push an annotated tag matching v* -- the workflow creates the GitHub
#     Release itself (using the tag's own annotation as the release notes,
#     falling back to auto-generated notes), then builds and attaches the
#     executables. Use this from a normal git client when the GitHub API's
#     Releases endpoint isn't available to you.
#  2. Publish a release by hand in the GitHub UI -- the workflow just builds
#     and attaches the executables to that release.
# Either way, PyInstaller builds a standalone executable for Windows, macOS
# and Linux, one per OS-native runner (PyInstaller does not cross-compile).
# The Windows .exe matches how every previous release's .exe was built by
# hand; macOS and Linux builds are new.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach executables to"
        required: true

permissions:
  contents: write

jobs:
  ensure-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag and create release if needed
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping creation."
            exit 0
          fi
          notes="$(git tag -l --format='%(contents)' "$tag")"
          if [ -z "$notes" ]; then
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --generate-notes
          else
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --notes "$notes"
          fi

  build-executable:
    needs: [ensure-release]
    if: always() && (needs.ensure-release.result == 'success' || needs.ensure-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: ""
            ext: ".exe"
            icon_args: --icon=YJE.ico
          - os: macos-latest
            suffix: "_macos"
            ext: ".tar.gz"
            icon_args: ""
          - os: ubuntu-latest
            suffix: "_linux"
            ext: ".tar.gz"
            icon_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux runner only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ needs.ensure-release.outputs.tag }}" ]; then
            echo "tag=${{ needs.ensure-release.outputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build executable
        shell: bash
        run: |
          pyinstaller --onefile --windowed ${{ matrix.icon_args }} \
            --name "Yoto_Json_Extractor_${{ steps.tag.outputs.tag }}${{ matrix.suffix }}" \
            YOTO.py

      - name: Package as tar.gz (macOS/Linux only)
        # On Unix a bare executable with no extension is normal and correct
        # (ls, git, docker... none of them have one either) - that was never
        # actually the problem. What matters is that a raw file downloaded
        # from a browser doesn't reliably keep its +x bit, and a lone binary
        # with no packaging is an unfamiliar download for most people. A
        # .tar.gz is the standard way these are distributed (same as
        # kubectl, terraform, etc.): it preserves the executable permission
        # on extraction and is a format everyone recognizes.
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          name="Yoto_Json_Extractor_${{ steps.tag.outputs.tag }}${{ matrix.suffix }}"
          chmod +x "dist/$name"
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - name: Upload executable to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "dist/Yoto_Json_Extractor_${{ steps.tag.outputs.tag }}${{ matrix.suffix }}${{ matrix.ext }}" \
            --repo "${{ github.repository }}" \
            --clobber
